# A generic, single database configuration.

[alembic]
# path to migration scripts (relative to this ini file)
script_location = alembic

# Make the project root importable from env.py so it can do
# `from app.db.models import Base`.
prepend_sys_path = .

# DATABASE_URL is read by alembic/env.py from the environment, not from here.
sqlalchemy.url =

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S